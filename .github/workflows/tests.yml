# Runs the Python test suites on every pull request and on main.
#
#   bash tests/run.sh   is what this runs, the same script a contributor runs.
#
# The curator page suites (tests/*.test.js) need a real study's worklist and
# are skipped here; run.sh says so in its last line. StarDist/TensorFlow and
# elastix are not installed: the suites that need them skip those parts.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox
    steps:
      - uses: actions/checkout@v4

      # pylibCZIrw ships wheels up to cp313 (see requirements-czi.txt).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: System libraries for Qt
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libgbm1 libasound2t64 \
            libfontconfig1 libdbus-1-3

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas pillow matplotlib tifffile \
            scikit-image openpyxl czifile imagecodecs pymupdf \
            opencv-python-headless PySide6 pylibCZIrw csbdeep

      - name: Run the suites
        run: PY=python bash tests/run.sh
